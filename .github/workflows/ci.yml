name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install deps
        # No Python 3.14 o marcador do requirements exclui o GX legado
        # (GX 0.18.x conflita com pandas 3; GX 1.x exige python <3.14).
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q

      - name: Smoke test do pipeline (CSV exemplo versionado)
        run: python -m src.pipeline --arquivo data/raw/clientes_exemplo.csv --schema cliente --chave id_cliente
